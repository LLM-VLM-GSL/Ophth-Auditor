# Publishes web/ as a static GitHub Pages site on every push to main. There is no server: the page loads
# the audit data from web/data/, keeps annotations in the rater's browser, and raters export them as a file.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Data is complete
        run: |
          test -f web/data/manifest.js || { echo "::error::web/data/manifest.js missing"; exit 1; }

      - name: Neutral naming (double-blind)
        run: |
          if grep -rIil -E 'ophth[-_ ]?500[-_ ]?k' --exclude-dir=.git . ; then
            echo "::error::the files above name the study dataset"; exit 1
          fi

      - name: The agent entry (web/agent/) matches the rubric and the cases
        run: python3 tools/build_agent_spec.py --check

      - name: The page code parses
        run: |
          for f in web/*.js; do node --check "$f"; done

      - name: The public site never talks to a server
        run: |
          grep -Eq 'server:[[:space:]]*false' web/config.js \
            || { echo "::error::web/config.js must set server to false"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
