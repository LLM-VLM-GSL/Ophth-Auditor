# Publishes web/ as a static GitHub Pages site on every push to main. The page loads the audit data from web/data/
# and keeps annotations in the rater's browser; raters download them as a file. When the repository variable
# AUDIT_RELAY_URL is set (the lab's relay, relay/relay.py, e.g. https://<lab host>/api/ophth-audit), it is written
# into web/config.js and the page also saves every annotation there as it is made (as Retify does).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Data is complete
        run: |
          test -f web/data/manifest.js || { echo "::error::web/data/manifest.js missing"; exit 1; }

      - name: Neutral naming (double-blind)
        run: |
          if grep -rIil -E 'ophth[-_ ]?500[-_ ]?k' --exclude-dir=.git . ; then
            echo "::error::the files above name the study dataset"; exit 1
          fi

      - name: The agent entry (web/agent/) matches the rubric and the cases
        run: python3 tools/build_agent_spec.py --check

      - name: The page code parses
        run: |
          for f in web/*.js; do node --check "$f"; done

      - name: Point the page at the relay
        if: vars.AUDIT_RELAY_URL != ''
        env:
          RELAY_URL: ${{ vars.AUDIT_RELAY_URL }}
        run: |
          printf 'window.AUDIT_CONFIG = { server: false, encrypted: false, relay: %s };\n' \
            "$(jq -Rn --arg u "${RELAY_URL%/}" '$u')" > web/config.js
          cat web/config.js

      - name: Check that the relay answers the page
        if: vars.AUDIT_RELAY_URL != ''
        env:
          RELAY_URL: ${{ vars.AUDIT_RELAY_URL }}
          OWNER: ${{ github.repository_owner }}
        run: |
          origin="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          curl -sf -H "Origin: $origin" "${RELAY_URL%/}/status" | jq -e .ok > /dev/null \
            || echo "::warning::the relay at $RELAY_URL/status does not answer; annotations will wait in raters' browsers until it does"

      - name: The public site never talks to a server
        run: |
          grep -Eq 'server:[[:space:]]*false' web/config.js \
            || { echo "::error::web/config.js must set server to false"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
